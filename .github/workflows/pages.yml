name: Publikovat časopis

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Načíst soubory
        uses: actions/checkout@v6
      - name: Připravit GitHub Pages
        uses: actions/configure-pages@v5
      - name: Zabalit statický web
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publikovat
        id: deployment
        uses: actions/deploy-pages@v4
